[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DifferentiableMachineLearning"
version = "0.2.0"
description = "A machine learning kits re-implementing classical models as torch.nn.Module, differentiable and composable with deep networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Liyulingyue" }]
dependencies = ["torch>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]